name: Портативная сборка для Windows 7

# Сборка ничего не компилирует: скачивает готовый embeddable Python 3.8.10, колёса cp38/win_amd64
# и раскладывает их по папкам. Поэтому результат работает на Windows 7, хотя сам раннер — новее.
# Раннеров с Windows 7 у GitHub нет, поэтому ЗАПУСК на рабочей машине проверяется вручную
# (dist_offline/check_install.py).

env:
  PYTHONUTF8: "1"           # в журнале Actions русский текст читается, а не падает
  PYTHONIOENCODING: "utf-8"

on:
  workflow_dispatch:        # запуск кнопкой на вкладке Actions
    inputs:
      model:
        description: "Вложить модель CLIP (~335 МБ). Без неё распознавание заметно слабее"
        type: boolean
        default: true
  push:
    tags: ["v*"]            # и на каждый тег версии

jobs:
  tests:
    name: Тесты
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"
          architecture: x64
      - run: python -m pip install -r requirements-dev.txt
      - name: Запуск тестов
        # тесты окна сами пропускаются, если графическая среда недоступна
        run: python -m pytest -q

  build:
    name: Сборка дистрибутива
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.8.10 (нужен ради файлов tkinter)
        uses: actions/setup-python@v5
        with:
          python-version: "3.8.10"
          architecture: x64

      - name: Скачать embeddable Python 3.8.10
        shell: pwsh
        run: |
          $url = "https://www.python.org/ftp/python/3.8.10/python-3.8.10-embed-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile python-embed.zip
          Get-FileHash python-embed.zip -Algorithm SHA256

      - name: Скачать библиотеки (cp38, win_amd64)
        run: python dist_offline/download_wheels.py --dest wheels

      - name: Скачать модель CLIP
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.model }}
        run: python tools/get_clip_model.py --dest model

      - name: Собрать дистрибутив
        shell: pwsh
        run: |
          $tk = python -c "import sys; print(sys.prefix)"
          $model = if (Test-Path "model/clip-vit-b32-vision.onnx") { @("--model", "model") } else { @() }
          python dist_offline/build_portable.py `
            --embed python-embed.zip `
            --wheels wheels `
            --tk-from "$tk" `
            --out "dist/CV" @model

      - name: Проверить, что onnxruntime загружается в собранном Python
        shell: pwsh
        run: |
          & "dist\CV\python\python.exe" -c "import onnxruntime; print('onnxruntime', onnxruntime.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "onnxruntime не загрузился: без него CLIP работать не будет" }

      - name: Проверить сборку (на Windows Server, не на Windows 7)
        shell: pwsh
        run: |
          & "dist\CV\python\python.exe" "dist\CV\check_install.py"

      - name: Выложить как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: cv-windows7-portable
          path: dist
          retention-days: 30
          # ОБЯЗАТЕЛЬНО: иначе выгрузка молча выбрасывает скрытые папки, а numpy держит
          # свою математическую библиотеку в «numpy/.libs» — без неё numpy не загружается
          include-hidden-files: true

  check-artifact:
    name: Проверка скачанного артефакта
    runs-on: windows-latest
    needs: build
    steps:
      - name: Скачать артефакт так же, как это делает человек
        uses: actions/download-artifact@v4
        with:
          name: cv-windows7-portable
          path: downloaded

      - name: Запустить проверку из скачанного дистрибутива
        shell: pwsh
        run: |
          $python = "downloaded/CV/python/python.exe"
          & $python "downloaded/CV/check_install.py"
          if ($LASTEXITCODE -ne 0) { throw "скачанный дистрибутив не прошёл проверку" }
